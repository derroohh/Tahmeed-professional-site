<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Tahmeed.com | Official Artist Portal, Tour Merch & Live Bookings</title>
    <meta name="title" content="Tahmeed.com | Official Artist Portal, Tour Merch & Live Bookings" />
    <meta name="description" content="Official artist portal of Tahmeed. Shop exclusive tour merchandise, limited vinyl pressings, book festival appearances and VIP performances, and watch verified music videos." />
    <meta name="keywords" content="tahmeed, tahmeed.com, Tahmeed artist, Tahmeed merch, Tahmeed tour, vinyl records, live bookings, tour hoodie, music videos, artist management, official merch" />
    <meta name="author" content="Tahmeed" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://tahmeed.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tahmeed.com/" />
    <meta property="og:title" content="Tahmeed.com | Official Artist Portal, Tour Merch & Live Bookings" />
    <meta property="og:description" content="Official artist portal of Tahmeed. Shop exclusive tour merchandise, limited vinyl pressings, book festival appearances and VIP performances, and watch verified music videos." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta property="og:site_name" content="Tahmeed.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tahmeed.com/" />
    <meta name="twitter:title" content="Tahmeed.com | Official Artist Portal, Tour Merch & Live Bookings" />
    <meta name="twitter:description" content="Official artist portal of Tahmeed. Shop exclusive tour merchandise, limited vinyl pressings, book festival appearances and VIP performances, and watch verified music videos." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Fonts: Plus Jakarta Sans for clean minimalist typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Google Identity Services client script for Sign in with Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Schema.org JSON-LD Structured Data for Google search rankings -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://tahmeed.com/#website",
          "url": "https://tahmeed.com/",
          "name": "Tahmeed.com",
          "description": "Official artist portal, tour merchandise storefront, and live booking hub for Tahmeed.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://tahmeed.com/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "MusicGroup",
          "@id": "https://tahmeed.com/#artist",
          "name": "Tahmeed",
          "url": "https://tahmeed.com/",
          "image": "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80",
          "sameAs": [
            "https://open.spotify.com/artist/tahmeed",
            "https://music.apple.com/artist/tahmeed",
            "https://youtube.com/@tahmeed",
            "https://instagram.com/tahmeed",
            "https://twitter.com/tahmeed"
          ]
        },
        {
          "@type": "Store",
          "@id": "https://tahmeed.com/#store",
          "name": "Tahmeed Official Merch Store",
          "url": "https://tahmeed.com/#store",
          "currenciesAccepted": "USD",
          "paymentAccepted": "Credit Card, Google Pay, Apple Pay",
          "priceRange": "$$"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#fbfbfd] text-stone-900 font-sans antialiased selection:bg-stone-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
